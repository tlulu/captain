apiVersion: apps/v1
kind: Deployment
metadata:
  name: captain
  labels:
    app: captain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: captain
  template:
    metadata:
      labels:
        app: captain
    spec:
      containers:
        - name: captain
          image: docker.io/library/captain:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000